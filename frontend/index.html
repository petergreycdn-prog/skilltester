<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillTester — Full-Stack TypeScript</title>
  <meta name="description" content="Aplicação full-stack com Hono, D1, Drizzle, JWT e Resend." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <script>
    (function() {
      var p = window.location.search.match(/p=([^&]*)/);
      if (p) {
        var q = window.location.search.match(/q=([^&]*)/);
        window.history.replaceState(null, null,
          window.location.pathname.split('/').slice(0,2).join('/') + '/' +
          p[1].replace(/~and~/g, '&') +
          (q ? '?' + q[1].replace(/~and~/g, '&') : '') +
          window.location.hash
        );
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
